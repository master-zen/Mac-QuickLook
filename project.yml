name: MacQuickLookModern
options:
  bundleIdPrefix: cn.masterzen
  projectFormat: xcode15_3
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: false
    MARKETING_VERSION: 0.4.0
    CURRENT_PROJECT_VERSION: '1'
targets:
  MacQuickLookModern:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [Info.plist, Entitlements.plist]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.masterzen.MacQuickLookModern
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Entitlements.plist
    dependencies:
      - target: QuickLookPreview
        embed: true
      - target: QuickLookThumbnail
        embed: true
  QuickLookPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/Preview
        excludes: [Info.plist, Entitlements.plist]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.masterzen.MacQuickLookModern.Preview
        INFOPLIST_FILE: Extensions/Preview/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/Preview/Entitlements.plist
        APPLICATION_EXTENSION_API_ONLY: YES
  QuickLookThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/Thumbnail
        excludes: [Info.plist, Entitlements.plist]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.masterzen.MacQuickLookModern.Thumbnail
        INFOPLIST_FILE: Extensions/Thumbnail/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/Thumbnail/Entitlements.plist
        APPLICATION_EXTENSION_API_ONLY: YES
  FormatCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.masterzen.MacQuickLookModern.Tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  MacQuickLookModern:
    build:
      targets:
        MacQuickLookModern: all
    test:
      targets: [FormatCoreTests]
